spring:
  application:
    name: grpc-observability-demo-test
  grpc:
    server:
      port: 9090
      observation:
        enabled: true

management:
  observations:
    annotations:
      enabled: true
  metrics:
    distribution:
      percentiles-histogram:
        grpc.server: true

otel:
  traces:
    exporter: none
  service:
    name: grpc-observability-demo-test
